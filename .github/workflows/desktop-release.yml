name: Build and Release Desktop App

on:
  push:
    branches:
      - development
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm run install:all

      - name: Build application and package desktop installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:dist

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinefile-desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
          if-no-files-found: warn
